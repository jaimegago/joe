apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: checkout-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/component: checkout-service
    spec:
      containers:
        - name: checkout
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          # Fully healthy. The two dependency URLs are plain env vars pointing at
          # the in-cluster Service DNS names, so the orders/payments dependency
          # edges are discoverable just by reading this pod spec.
          env:
            - name: PAYMENTS_URL
              value: http://payments.shop.svc.cluster.local
            - name: ORDERS_URL
              value: http://orders.shop.svc.cluster.local
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: shop
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app.kubernetes.io/name: checkout
  ports:
    - name: http
      port: 80
      targetPort: http
