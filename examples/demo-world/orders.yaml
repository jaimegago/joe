apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: shop
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: shop
    app.kubernetes.io/component: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders
        app.kubernetes.io/part-of: shop
        app.kubernetes.io/component: order-service
    spec:
      containers:
        - name: orders
          image: python:3.12-slim
          # MAINTAINER NOTE — the script below is deliberately uncommented, and its
          # log lines deliberately read like an ordinary order service. Agents read
          # pod specs and logs: anything written inside `args` comes straight back
          # out of `kubectl get deployment -o yaml` (and is copied again into the
          # last-applied-configuration annotation), so a comment there would hand a
          # copilot the answer instead of making it diagnose the cluster. Do not
          # reintroduce explanatory comments or self-describing log lines into
          # `args`. The engineered behaviour is documented in full in this
          # directory's README.md, which is not reachable from cluster state.
          command: ["python", "-u", "-c"]
          args:
            - |
              import time

              state = "/state/starts"
              try:
                  with open(state) as f:
                      starts = int(f.read().strip())
              except (FileNotFoundError, ValueError):
                  starts = 0
              starts += 1
              with open(state, "w") as f:
                  f.write(str(starts))

              cache = bytearray(100 * 1024 * 1024)
              buffers = [cache]

              INITIAL_STARTS = 3

              print("orders: order processor started, warming batch cache", flush=True)

              if starts <= INITIAL_STARTS:
                  time.sleep(15)
                  print("orders: processing batch 1", flush=True)
                  buffers.append(bytearray(45 * 1024 * 1024))
                  time.sleep(3600)
              else:
                  cycle = 0
                  while True:
                      time.sleep(30)
                      cycle += 1
                      print("orders: processing batch %d" % cycle, flush=True)
                      if cycle % 26 == 0:
                          buffers.append(bytearray(45 * 1024 * 1024))
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              memory: 96Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 250m
      volumes:
        - name: state
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: orders
  namespace: shop
  labels:
    app.kubernetes.io/name: orders
    app.kubernetes.io/part-of: shop
spec:
  selector:
    app.kubernetes.io/name: orders
  ports:
    - name: http
      port: 80
      targetPort: 8080
