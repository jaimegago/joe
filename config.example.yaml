# Joe Configuration Example
# Copy to ~/.joe/config.yaml and customize

llm:
  # Currently active model key (must match a key in 'available')
  current: claude-sonnet

  # All configured models
  available:
    claude-sonnet:
      provider: claude
      model: claude-sonnet-4-20250514
    gemini-flash:
      provider: gemini
      model: gemini-2.5-flash

  # Note: API keys are NEVER stored in config files
  # Set via environment variables:
  #   - Claude: ANTHROPIC_API_KEY
  #   - Gemini: GEMINI_API_KEY or GOOGLE_API_KEY

server:
  address: "localhost:7777"

refresh:
  # Background refresh interval in minutes
  interval_minutes: 5

  # LLM usage limits during background refresh
  llm_budget:
    max_calls_per_hour: 100
    batch_threshold: 10
    batch_timeout_sec: 30

# Auto Joe run budget (read-only autonomous pass over a scope of components,
# started by an operator trigger or an installed schedule; executes as joe's
# own svc:agent:core identity). Every run carries both ceilings; a run that
# hits either stops and still reports, funded from the reserves held outside
# the ceilings. A schedule's cost is runs times ceiling.
auto_run:
  # Token ceiling per run (input + output, summed over the pass)
  token_ceiling: 1000000
  # Wall-clock ceiling per run, in minutes
  wall_clock_minutes: 20
  # Output reserve for the report a ceiling-stopped run still writes
  report_reserve_tokens: 50000
  # Wall-clock reserve for that report, in seconds
  report_reserve_seconds: 120

logging:
  # Log level: debug, info, warn, error
  level: info

  # Log file path (empty = stdout)
  file: ""

# Note: Infrastructure sources (K8s, Git, AWS) are registered via the API or joe CLI
# AWS example requires AWS credentials configured via:
#   - AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY environment variables
#   - AWS CLI shared credentials (~/.aws/credentials)
#   - IAM roles (recommended for production)
#   - AWS SSO
# Use: joe sources add --name production-aws --type aws --region us-west-2
