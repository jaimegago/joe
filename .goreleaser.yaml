# GoReleaser configuration — publishes on tag push (D-0091).
#
# The tag-triggered `.github/workflows/release.yml` runs `goreleaser release
# --clean` only on a `v`-prefixed tag push, publishing a GitHub Release
# carrying the built archives and a checksums file. The unchanged
# `goreleaser-build` CI job keeps validating the same config in snapshot mode
# (`goreleaser build --snapshot --clean`) on every push/PR with no publish —
# `release` and `build` are separate goreleaser subcommands, and only the
# tag-triggered workflow ever invokes `release`.
#
# Distribution is published release binaries plus build-from-source, as peers
# (D-0122). The published artifact set is archives + checksums ONLY: there is
# deliberately no `signs:` block below, and no tap/bucket/installer target —
# adding any of those is its own posture decision (see CLAUDE.md /
# docs/backlog/release-pipeline.md). The operator cuts the tag, never CI.
version: 2

project_name: joe

before:
  hooks:
    - go mod download
    # Stages the real web UI into internal/webui/dist before any goreleaser
    # build/release runs (release, local build, or the CI snapshot job) — see
    # the script for why this must be a goreleaser-level hook rather than a
    # workflow-only step.
    - ./scripts/stage-ui-for-release.sh

builds:
  - id: joe
    main: ./cmd/joe
    binary: joe
    # modernc.org/sqlite is pure Go, so CGO is off and cross-compilation is clean.
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    # The SAME three injections the Makefile uses, addressed by full import path.
    # A plain build with none of these still reports the "dev" defaults.
    ldflags:
      - -s -w
      - -X github.com/jaimegago/joe/internal/buildinfo.Version={{ .Version }}
      - -X github.com/jaimegago/joe/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/jaimegago/joe/internal/buildinfo.BuildTime={{ .Date }}

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

archives:
  - id: joe
    formats:
      - tar.gz

checksum:
  name_template: checksums.txt

# Publishes a GitHub Release on a tag push. release.disable is omitted
# (default false); only the tag-triggered release workflow ever invokes
# `goreleaser release` — the CI snapshot job only ever invokes `build`, which
# never publishes regardless of this setting. Release notes are goreleaser's
# default commit-log changelog (no changelog: block configured).
release:
  github:
    owner: jaimegago
    name: joe
