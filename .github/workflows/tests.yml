name: Tests
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run unit tests
        run: make test-unit

      - name: Generate coverage report
        run: make test-coverage-unit

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run integration tests
        run: make test-integration

      - name: Generate coverage report
        run: make test-coverage-integration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-integration.out
          flags: integration
          name: codecov-integration

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    env:
      # Use test/mock API keys for e2e tests
      # For real E2E with actual LLMs, use secrets
      GEMINI_API_KEY: ${{ secrets.TEST_GEMINI_API_KEY || 'test-key' }}
      ANTHROPIC_API_KEY: ${{ secrets.TEST_ANTHROPIC_API_KEY || 'test-key' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # `make build` now embeds the real UI via the build-ui prerequisite, so
      # the UI is built here (Node setup above). The unit, integration, and
      # lint jobs deliberately stay Node-free and compile against the committed
      # placeholder.
      - name: Build binaries (embeds the web UI)
        run: make build

      - name: Run e2e tests
        run: make test-e2e
        timeout-minutes: 10

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/*.log
            **/*.log
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: make vet

      - name: Run gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  # Exercises the same .goreleaser.yaml the tag-triggered release workflow
  # uses, in snapshot mode: a full local build (including the before.hooks UI
  # staging step, hence the Node setup below) that proves the ldflags -X
  # injection into internal/buildinfo works, the real UI gets embedded rather
  # than the placeholder, and the build is green. This job only ever invokes
  # `goreleaser build`, never `release` — no publish, no tag trigger, no
  # artifact upload happens here regardless of .goreleaser.yaml's release
  # settings. Distribution stays build-from-source until a tag push runs the
  # separate release workflow.
  goreleaser-build:
    name: GoReleaser Snapshot Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # goreleaser derives the version from git describe, so it needs the
          # full history and tags, not a shallow checkout.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run GoReleaser (snapshot build, no publish)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: build --snapshot --clean

      - name: Verify the snapshot binary embeds the real UI, not the placeholder
        run: |
          set -euo pipefail

          bin="$(find dist -type f -path '*linux_amd64*/joe' | head -1)"
          if [ -z "$bin" ]; then
            echo "::error::no linux_amd64 joe binary found under dist/"
            exit 1
          fi
          chmod +x "$bin"

          workdir="$(mktemp -d)"
          cfg="$workdir/config.yaml"
          cat > "$cfg" <<CONFIGEOF
          llm:
            current: verify
            available:
              verify:
                provider: gemini
                model: gemini-2.0-flash
          server:
            address: localhost:7777
          database:
            driver: sqlite
            dsn: $workdir/joe.db
          logging:
            level: info
          CONFIGEOF

          service_account_key="ci-verify-service-account-key-not-a-real-credential"
          JOE_CONFIG="$cfg" JOE_API_KEY="$service_account_key" \
            GEMINI_API_KEY="ci-dummy-key-not-a-real-credential-0000000" \
            HOME="$workdir" "$bin" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          version_json=""
          for _ in $(seq 1 30); do
            if version_json="$(curl -sf -H "Authorization: Bearer $service_account_key" http://localhost:7777/api/v1/version)"; then
              break
            fi
            sleep 1
          done
          if [ -z "$version_json" ]; then
            echo "::error::joe never became ready on :7777"
            exit 1
          fi

          actual_digest="$(echo "$version_json" | jq -r '.ui_digest')"
          expected_digest="$(go run ./scripts/verify-ui-digest internal/webui/dist)"

          placeholder_dir="$(mktemp -d)"
          cp internal/webui/dist/.gitkeep "$placeholder_dir/"
          placeholder_digest="$(go run ./scripts/verify-ui-digest "$placeholder_dir")"

          echo "actual=$actual_digest expected=$expected_digest placeholder=$placeholder_digest"

          if [ "$actual_digest" != "$expected_digest" ]; then
            echo "::error::booted binary's ui_digest ($actual_digest) does not match the digest computed over the staged internal/webui/dist ($expected_digest)"
            exit 1
          fi
          if [ "$actual_digest" = "$placeholder_digest" ]; then
            echo "::error::booted binary embeds the placeholder UI, not a real build"
            exit 1
          fi
          echo "UI-staging guarantee holds: booted ui_digest matches the staged real UI and differs from the placeholder"

  # The single aggregate this workflow exposes. It is the check the branch
  # ruleset requires, so its pass/fail semantics decide what can reach main.
  #
  # `skipped` is acceptable, `failure` and `cancelled` are not. A job that did
  # not need to run for this diff has proved nothing and disproved nothing, and
  # treating that as failure would deadlock every path-filtered merge once the
  # ruleset requires this check. Only a job that ran and did not pass fails the
  # gate.
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, lint, goreleaser-build]
    if: always()
    steps:
      - name: Check test results
        env:
          RESULTS: |
            Unit Tests=${{ needs.unit-tests.result }}
            Integration Tests=${{ needs.integration-tests.result }}
            End-to-End Tests=${{ needs.e2e-tests.result }}
            Lint=${{ needs.lint.result }}
            GoReleaser Snapshot Build=${{ needs.goreleaser-build.result }}
        run: |
          set -euo pipefail
          status=0
          while IFS='=' read -r job result; do
            [ -z "$job" ] && continue
            case "$result" in
              success) echo "pass    $job" ;;
              skipped) echo "skipped $job (not required for this diff)" ;;
              *)
                echo "::error::$job concluded '$result'"
                status=1
                ;;
            esac
          done <<< "$RESULTS"
          if [ "$status" -ne 0 ]; then
            echo "::error::One or more test jobs failed"
            exit 1
          fi
          echo "Gate green: every job that ran passed."
