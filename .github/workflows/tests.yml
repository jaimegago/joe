name: Tests

# The merge gate. This workflow answers exactly one question — is `main`
# broken — and its `Test Summary` job is the check the `main` ruleset requires.
# Releasability is a heavier question and lives in post-merge.yml.
#
# Path filtering applies to pull requests only. Every other trigger runs the
# full unfiltered matrix, because filtering buys merge latency and nothing
# else, and only a pull request is waiting on it. The nightly schedule is the
# complement to erring broad: a misclassified diff skips the job that would
# have caught it, and the unfiltered run catches that within a day rather than
# at the next release.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly full unfiltered matrix.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Decides which gate jobs this diff owes, keyed to the class scopes in
  # docs/verification.md. Ambiguous classification errs broad: every pattern
  # here is wider than the class it stands for, and the cost of a needless run
  # is minutes while the cost of a missed one is a red `main`.
  classify:
    name: Classify Diff
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.classify.outputs.go }}
      frontend: ${{ steps.classify.outputs.frontend }}
      e2e: ${{ steps.classify.outputs.e2e }}
      goreleaser: ${{ steps.classify.outputs.goreleaser }}
    steps:
      - name: Classify changed paths
        id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          emit() {
            {
              echo "go=$1"
              echo "frontend=$2"
              echo "e2e=$3"
              echo "goreleaser=$4"
            } >> "$GITHUB_OUTPUT"
            echo "classification: go=$1 frontend=$2 e2e=$3 goreleaser=$4"
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Event is '$EVENT_NAME', not a pull request — full unfiltered matrix."
            emit true true true true
            exit 0
          fi

          # One JSON object per changed file: its path, its status (added,
          # modified, removed, renamed, ...) and its patch. GitHub omits the
          # patch for a file too large to diff.
          entries="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[] | {filename, status, patch}')"
          files="$(printf '%s\n' "$entries" | jq -r '.filename')"
          echo "changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          touches() { printf '%s\n' "$files" | grep -Eq "$1"; }

          # go-backend, go-tagged-tests and rbac, plus the infrastructure that
          # decides how any of them run. Any .go file anywhere counts.
          go=false
          if touches '\.go$|^go\.(mod|sum)$|^Makefile$|^\.golangci\.yml$|^\.github/workflows/'; then
            go=true
          fi

          # frontend. ui/ build and test configuration belongs to
          # verification-infrastructure but lives under ui/, so the whole
          # subtree counts.
          frontend=false
          if touches '^ui/|^Makefile$|^\.github/workflows/'; then
            frontend=true
          fi

          # End-to-End gates when the diff touches test/e2e/, and is
          # post-merge otherwise. A feature ships with a deterministic e2e
          # test (joe-pm decision 0018), so a feature pull request carries one
          # under test/e2e/ and pays for running it; a docs or refactor pull
          # request does not. The suite runs joe against the harness's
          # scripted responder, with no LLM and no key, which is what makes it
          # fit for the gate.
          e2e=false
          if touches '^test/e2e/'; then
            e2e=true
          fi

          # GoReleaser Snapshot Build is POST-MERGE, always. Never on a pull
          # request, whatever the diff touches. It is a packaging build, and
          # releasability is a real question that is not the gate's. At 538s
          # it was the single largest cost in the gate, and it was pulled in
          # by any diff touching .github/workflows/ — including a diff to this
          # file. It still runs on every push to main and in the nightly
          # unfiltered matrix, via the early return above. Red there flips the
          # responsible thread from done back to blocked, per joe-pm AGENTS.md.
          goreleaser=false

          # feature-e2e (docs/verification.md): a diff that adds an HTTP
          # route, a migration or a UI page owes an end-to-end test, so it
          # must carry a test/e2e/ path. Refused here, where no session can
          # talk the check out of running.
          #
          # "Adds" is decided from the diff. A migration or a page is an added
          # file. A route or a <Route> is an added line whose text was not
          # also removed in the same diff, so moving a registration is not
          # adding one.
          added_files="$(printf '%s\n' "$entries" | jq -r 'select(.status == "added") | .filename')"
          added_lines() {
            # $1: a jq regex selecting files, $2: an ERE selecting lines.
            # Prints the matching lines the diff adds to those files, minus
            # any line it also removes from them. Test files never count.
            local sel plus minus
            sel="$(printf '%s\n' "$entries" | jq -r --arg f "$1" \
              'select((.filename | test($f)) and (.filename | test("[._]test\\.(go|tsx)$") | not)) | .patch // empty')"
            plus="$(printf '%s\n' "$sel" | grep -E '^\+' | grep -Ev '^\+\+\+' | sed -E 's/^\+[[:space:]]*//' | grep -E "$2" | sort -u || true)"
            minus="$(printf '%s\n' "$sel" | grep -E '^-' | grep -Ev '^---' | sed -E 's/^-[[:space:]]*//' | grep -E "$2" | sort -u || true)"
            comm -23 <(printf '%s\n' "$plus") <(printf '%s\n' "$minus") | sed '/^$/d'
          }
          migrations="$(printf '%s\n' "$added_files" | grep -E '^internal/store/migrations/' || true)"
          pages="$(printf '%s\n' "$added_files" | grep -E '^ui/src/pages/.*\.tsx$' | grep -Ev '\.test\.tsx$' || true)"
          routes="$(added_lines '^(internal|cmd)/.*\.go$' '(HandleFunc|Handle)\(')"
          ui_routes="$(added_lines '^ui/src/.*\.tsx$' '<Route([[:space:]>]|$)')"
          unpatched="$(printf '%s\n' "$entries" | jq -r 'select(.patch == null) | .filename' | grep -E '^(internal|cmd)/.*\.go$|^ui/src/.*\.tsx$' || true)"
          if [ -n "$unpatched" ]; then
            echo "::warning::GitHub returned no patch for these files, so they were not inspected for added routes: $(printf '%s ' $unpatched)"
          fi
          if [ -n "$migrations$pages$routes$ui_routes" ]; then
            echo "feature-e2e scope matched:"
            for kind in migrations pages routes ui_routes; do
              printf '%s\n' "${!kind}" | sed '/^$/d' | sed "s|^|  $kind: |"
            done
            if [ "$e2e" != "true" ]; then
              echo "::error::This diff is in the feature-e2e class (docs/verification.md): it adds an HTTP route, a migration or a UI page, and carries no test/e2e/ path. A feature ships with a deterministic end-to-end test under test/e2e/ (joe-pm decision 0018)."
              exit 1
            fi
          fi

          emit "$go" "$frontend" "$e2e" "$goreleaser"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.go == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # Coverage generation re-ran the whole suite a second time for an upload
      # that gates nothing. It moved to post-merge.yml along with the upload.
      - name: Run unit tests
        run: make test-unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.go == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run integration tests
        run: make test-integration

  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.e2e == 'true'
    # No LLM key, deliberately. The harness points joe's openai-compat
    # provider at a scripted responder it runs in the test process
    # (test/e2e/responder.go), so the suite needs no network and no model.
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # `make build` now embeds the real UI via the build-ui prerequisite, so
      # the UI is built here (Node setup above). The unit, integration, and
      # lint jobs deliberately stay Node-free and compile against the committed
      # placeholder.
      - name: Build binaries (embeds the web UI)
        run: make build

      - name: Run e2e tests
        run: make test-e2e
        timeout-minutes: 10

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            /tmp/*.log
            **/*.log
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.go == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # setup-go v5 caches the module cache and the build cache by default and
      # was already covering this job before it said so; run 31430252511's Lint
      # job reports `Cache restored successfully`. Declared explicitly here
      # because caching is production infrastructure and should not be an
      # inherited default nobody can see. A second actions/cache step is
      # deliberately not added: it would shadow a cache that already covers
      # strictly more, GOCACHE as well as GOMODCACHE.
      #
      # THIS WAS REVERSED ON 2026-08-18 AND REVERTED ON 2026-08-19. Do not try
      # it again without new evidence. The reversal replaced setup-go's cache
      # with a per-job actions/cache covering both paths, on the theory that
      # setup-go's key has no job component and the jobs therefore evict each
      # other. The key observation is true; the change was still wrong:
      #
      #   - It delivered nothing. Unit Tests ran 219s before, 217s and 234s
      #     after. The premise that the gate was compile-bound came from
      #     comparing a warm local Apple Silicon run (~60s of test time) against
      #     a 2-core ubuntu runner, which is not a comparison.
      #   - It doubled the cache footprint. setup-go's `cache` input defaults to
      #     true, so removing the explicit line changed nothing and both
      #     mechanisms ran: ~880MB of setup-go caches alongside 932MB
      #     (unit-tests), 955MB (lint) and 1591MB (goreleaser-build) of per-job
      #     ones, against a 10GB repository limit.
      #   - Eviction followed. The 2026-08-19 nightly logged `Cache not found
      #     for input keys: Linux-go-unit-tests-...` — the per-job cache had
      #     already been evicted.
      #
      # Unit Tests is execution-bound, not compile-bound. The lever is test
      # parallelism; see docs/backlog/gate-unit-test-parallelism.md.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: make vet

      # The build-tagged trees are invisible to `go vet ./...`, so a deleted
      # symbol can leave test/integration and test/e2e uncompilable while the
      # whole default toolchain stays green. D-0118 was exactly that. This is
      # the first machine to run it.
      - name: Run go vet over the build-tagged trees
        run: make vet-tagged

      - name: Run gofmt
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  # The frontend had no lint and no unit coverage in CI at all: the single UI
  # command anywhere was `npm run build`, via the e2e job's `make build`. Both
  # commands fit inside the gate's headroom, so both gate.
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.frontend == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: Run eslint
        run: cd ui && npm run lint

      # --run is explicit rather than relying on vitest inferring CI and not
      # entering watch mode.
      - name: Run vitest
        run: cd ui && npm test -- --run

  # Exercises the same .goreleaser.yaml the tag-triggered release workflow
  # uses, in snapshot mode: a full local build (including the before.hooks UI
  # staging step, hence the Node setup below) that proves the ldflags -X
  # injection into internal/buildinfo works, the real UI gets embedded rather
  # than the placeholder, and the build is green. This job only ever invokes
  # `goreleaser build`, never `release` — no publish, no tag trigger, no
  # artifact upload happens here regardless of .goreleaser.yaml's release
  # settings. Distribution stays build-from-source until a tag push runs the
  # separate release workflow.
  #
  # It is out of the default gate: at ~540s it set the entire wall clock, twice
  # the next job, to answer a releasability question the gate does not ask. It
  # is pulled back in when the diff touches release-packaging or frontend
  # paths, where it is the check that actually matters, and otherwise runs
  # post-merge on the push to main.
  goreleaser-build:
    name: GoReleaser Snapshot Build
    runs-on: ubuntu-latest
    needs: classify
    if: needs.classify.outputs.goreleaser == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # goreleaser derives the version from git describe, so it needs the
          # full history and tags, not a shallow checkout.
          fetch-depth: 0

      # Same as the Lint job: setup-go v5's default caching already covered
      # this, and the declaration makes it visible.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Run GoReleaser (snapshot build, no publish)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: build --snapshot --clean

      - name: Verify the snapshot binary embeds the real UI, not the placeholder
        run: |
          set -euo pipefail

          bin="$(find dist -type f -path '*linux_amd64*/joe' | head -1)"
          if [ -z "$bin" ]; then
            echo "::error::no linux_amd64 joe binary found under dist/"
            exit 1
          fi
          chmod +x "$bin"

          workdir="$(mktemp -d)"
          cfg="$workdir/config.yaml"
          cat > "$cfg" <<CONFIGEOF
          llm:
            current: verify
            available:
              verify:
                provider: gemini
                model: gemini-2.0-flash
          server:
            address: localhost:7777
          database:
            driver: sqlite
            dsn: $workdir/joe.db
          logging:
            level: info
          CONFIGEOF

          service_account_key="ci-verify-service-account-key-not-a-real-credential"
          JOE_CONFIG="$cfg" JOE_API_KEY="$service_account_key" \
            GEMINI_API_KEY="ci-dummy-key-not-a-real-credential-0000000" \
            HOME="$workdir" "$bin" &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT

          version_json=""
          for _ in $(seq 1 30); do
            if version_json="$(curl -sf -H "Authorization: Bearer $service_account_key" http://localhost:7777/api/v1/version)"; then
              break
            fi
            sleep 1
          done
          if [ -z "$version_json" ]; then
            echo "::error::joe never became ready on :7777"
            exit 1
          fi

          actual_digest="$(echo "$version_json" | jq -r '.ui_digest')"
          expected_digest="$(go run ./scripts/verify-ui-digest internal/webui/dist)"

          placeholder_dir="$(mktemp -d)"
          cp internal/webui/dist/.gitkeep "$placeholder_dir/"
          placeholder_digest="$(go run ./scripts/verify-ui-digest "$placeholder_dir")"

          echo "actual=$actual_digest expected=$expected_digest placeholder=$placeholder_digest"

          if [ "$actual_digest" != "$expected_digest" ]; then
            echo "::error::booted binary's ui_digest ($actual_digest) does not match the digest computed over the staged internal/webui/dist ($expected_digest)"
            exit 1
          fi
          if [ "$actual_digest" = "$placeholder_digest" ]; then
            echo "::error::booted binary embeds the placeholder UI, not a real build"
            exit 1
          fi
          echo "UI-staging guarantee holds: booted ui_digest matches the staged real UI and differs from the placeholder"

  # The single aggregate this workflow exposes. It is the check the branch
  # ruleset requires, so its pass/fail semantics decide what can reach main.
  #
  # `skipped` is acceptable, `failure` and `cancelled` are not. A job that did
  # not need to run for this diff has proved nothing and disproved nothing, and
  # treating that as failure would deadlock every path-filtered merge. Only a
  # job that ran and did not pass fails the gate.
  #
  # `classify` is the exception: it is the job that decides what the others
  # owe, so a skip or failure there is not an absence of obligation, it is an
  # unknown one. It must succeed.
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [classify, unit-tests, integration-tests, e2e-tests, lint, frontend-checks, goreleaser-build]
    if: always()
    steps:
      - name: Check test results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          RESULTS: |
            Unit Tests=${{ needs.unit-tests.result }}
            Integration Tests=${{ needs.integration-tests.result }}
            End-to-End Tests=${{ needs.e2e-tests.result }}
            Lint=${{ needs.lint.result }}
            Frontend Checks=${{ needs.frontend-checks.result }}
            GoReleaser Snapshot Build=${{ needs.goreleaser-build.result }}
        run: |
          set -euo pipefail

          if [ "$CLASSIFY_RESULT" != "success" ]; then
            echo "::error::Classify Diff concluded '$CLASSIFY_RESULT'; what this diff owes is unknown"
            exit 1
          fi

          status=0
          while IFS='=' read -r job result; do
            if [ -z "$job" ]; then
              continue
            fi
            case "$result" in
              success) echo "pass    $job" ;;
              skipped) echo "skipped $job (not required for this diff)" ;;
              *)
                echo "::error::$job concluded '$result'"
                status=1
                ;;
            esac
          done <<< "$RESULTS"

          if [ "$status" -ne 0 ]; then
            echo "::error::One or more test jobs failed"
            exit 1
          fi
          echo "Gate green: every job that ran passed."
