version: "2"

run:
  timeout: 5m
  tests: true

linters:
  disable:
    - errcheck  # Disable errcheck - too noisy for defer/Close patterns
    - staticcheck  # Disable staticcheck - mostly style issues with user-facing messages
  enable:
    - ineffassign
    - govet
    - unused

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
